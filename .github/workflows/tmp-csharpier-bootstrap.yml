name: tmp-csharpier-bootstrap
on:
  push:
    branches: [tmp/csharpier-bootstrap]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/csharpier
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Format and push
        run: |
          dotnet tool restore
          dotnet csharpier format .
          dotnet csharpier check .
          git config user.name "csharpier-bootstrap"
          git config user.email "csharpier-bootstrap@users.noreply.github.com"
          git add -A
          git commit -qm "Format codebase with CSharpier"
          git push origin HEAD:refs/heads/tmp/csharpier-formatted
      - name: Restore
        run: dotnet restore E2E.slnx
      - name: Build
        run: dotnet build E2E.slnx --no-restore -c Release 2>&1 | tail -8
      - name: Format style and analyzers
        run: |
          dotnet format style E2E.slnx --verify-no-changes --no-restore
          dotnet format analyzers E2E.slnx --verify-no-changes --no-restore
      - name: Hook target dry run (CI unset)
        run: |
          git status --short | head
          CI= GITHUB_ACTIONS= dotnet restore src/E2E/E2E.csproj
          ls -la .husky .husky/_ ; git config core.hooksPath
